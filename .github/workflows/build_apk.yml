name: Build Wirdi Test APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.wirdi --project-name wirdi .

      - name: Patch Android Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Patch AndroidManifest.xml
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              if "android.permission.INTERNET" not in text:
                  perms = '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
                  text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' + perms)
              if "<queries>" not in text:
                  queries = '\n    <queries><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent><intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent></queries>'
                  text = text.replace("</manifest>", queries + "\n</manifest>")
              manifest.write_text(text)

          # 2. Patch App build.gradle (Force SDK 36 + Desugaring)
          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists(): app_gradle = Path("android/app/build.gradle.kts")
          
          if app_gradle.exists():
              content = app_gradle.read_text()
              is_kts = app_gradle.suffix == ".kts"
              
              # Force compileSdk 36
              content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
              content = re.sub(r'compileSdkVersion\s*\d+', 'compileSdkVersion 36', content)
              
              # Enable Desugaring flag
              if "compileOptions {" in content:
                  if "DesugaringEnabled" not in content:
                      flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
                      content = content.replace("compileOptions {", f"compileOptions {{\n        {flag}", 1)
              
              # Add Desugaring Library (Append to end of file to be safe)
              if "coreLibraryDesugaring" not in content:
                  dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
                  content += f"\ndependencies {{\n    {dep}\n}}\n"
              
              app_gradle.write_text(content)

          # 3. Patch Root build.gradle (Force all plugins to SDK 36)
          root_gradle = Path("android/build.gradle")
          if root_gradle.exists():
              root_text = root_gradle.read_text()
              if "subprojects {" not in root_text:
                  override = "\nsubprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 36; buildToolsVersion '36.0.0' } } } }\n"
                  root_text += override
                  root_gradle.write_text(root_text)
          PY

      - name: Debug - Show Patched Gradle
        run: cat android/app/build.gradle || cat android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
