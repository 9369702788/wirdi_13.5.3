name: Build Wirdi Test APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate Android platform folder
        run: flutter create --platforms=android --org com.wirdi --project-name wirdi .

      - name: Patch Android Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Patch AndroidManifest.xml for Permissions
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              text = manifest_path.read_text()
              permissions = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
                  <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              """
              if "android.permission.INTERNET" not in text:
                  text = text.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permissions,
                  )
              queries = """
                  <queries>
                      <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                      <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>
                  </queries>
              """
              if "<queries>" not in text:
                  text = text.replace("</manifest>", queries + "</manifest>")
              manifest_path.write_text(text)

          # 2. Patch app/build.gradle (SDK 36 + Desugaring)
          gradle_path = Path("android/app/build.gradle")
          if not gradle_path.exists():
              gradle_path = Path("android/app/build.gradle.kts")
          
          if gradle_path.exists():
              text = gradle_path.read_text()
              is_kts = gradle_path.suffix == ".kts"
              
              # Force compileSdk 36
              text = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 36', text)
              text = re.sub(r'compileSdkVersion\s*.*', 'compileSdkVersion 36', text)
              
              # Enable Desugaring
              if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
                  flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
                  text = text.replace("compileOptions {", "compileOptions {\n        " + flag, 1)
              
              if "coreLibraryDesugaring" not in text:
                  dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
                  text = text.replace("dependencies {", "dependencies {\n    " + dep, 1)
              
              gradle_path.write_text(text)

          # 3. Patch root build.gradle (Force ALL plugins to SDK 36)
          root_gradle = Path("android/build.gradle")
          if root_gradle.exists():
              root_text = root_gradle.read_text()
              override = """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          buildToolsVersion "36.0.0"
                      }
                  }
              }
          }
          """
              if "subprojects {" not in root_text:
                  root_text += override
                  root_gradle.write_text(root_text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirdi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
